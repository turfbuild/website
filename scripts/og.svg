<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#22322d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#123023" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0e1614" stop-opacity="0"/>
    </radialGradient>
    <style>
      .disp { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- full-bleed background; only the middle 630 rows (y 285..915) are kept -->
  <rect width="1200" height="1200" fill="#0e1614"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(80,320)">
    <rect x="0" y="-28" width="44" height="44" rx="12" fill="#147a48"/>
    <text x="22" y="3" text-anchor="middle" class="mono" font-size="32" font-weight="700" fill="#ffffff">+</text>
    <text x="62" y="6" class="disp" font-size="32" fill="#e7efeb">turf<tspan fill="#6d7f78" font-weight="500">.build</tspan></text>
  </g>

  <!-- eyebrow -->
  <text x="82" y="548" class="mono" font-size="21" letter-spacing="3" fill="#52c88a">INFRASTRUCTURE AGENT · GOVERNED BY THE PLAN</text>

  <!-- headline -->
  <text x="78" y="622" class="disp" font-size="62" letter-spacing="-2" fill="#e7efeb">Control your infrastructure AI</text>
  <text x="78" y="696" class="disp" font-size="62" letter-spacing="-2" fill="#e7efeb">with <tspan class="mono" font-size="52" fill="#6fdba1">Terraform plans</tspan>.</text>

  <!-- subline -->
  <text x="82" y="772" class="disp" font-weight="500" font-size="25" fill="#9baba4">A drop-in replacement for Terraform — every change planned, visible, approved.</text>

  <!-- accent bar -->
  <rect x="82" y="806" width="132" height="6" rx="3" fill="#147a48"/>
</svg>
